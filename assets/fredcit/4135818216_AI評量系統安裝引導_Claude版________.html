<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>生活科技萬用評分系統操作導引</title>
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=LXGW+WenKai+TC:wght@700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 版面概念：工廠的工序單。左側是依序走過的工站，右側是目前工站的作業內容與檢驗項目。 */
:root{
  --bg:#F2F5F2; --surface:#FFFFFF; --sunken:#E9EEEA; --ink:#1B2928; --muted:#566664; --line:#D2DBD5;
  --accent:#0E6A5B; --accent-ink:#FFFFFF; --accent-soft:#DCEEE8;
  --warn:#8A4B00; --warn-soft:#FBEFD8; --danger:#A9322A; --danger-soft:#FBE6E3; --code-bg:#EDF1EE;
  --display:"LXGW WenKai TC","Noto Serif TC",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101716; --surface:#172120; --sunken:#1F2B29; --ink:#E5EEEA; --muted:#9BADA8; --line:#2E3D3A;
  --accent:#54C7AD; --accent-ink:#08201B; --accent-soft:#17352E;
  --warn:#EDB25A; --warn-soft:#33270F; --danger:#F08C80; --danger-soft:#3A1D19; --code-bg:#1F2B29; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#101716; --surface:#172120; --sunken:#1F2B29; --ink:#E5EEEA; --muted:#9BADA8; --line:#2E3D3A;
  --accent:#54C7AD; --accent-ink:#08201B; --accent-soft:#17352E;
  --warn:#EDB25A; --warn-soft:#33270F; --danger:#F08C80; --danger-soft:#3A1D19; --code-bg:#1F2B29; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.75 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:var(--accent);text-underline-offset:3px}
code{font:500 .86em var(--mono);background:var(--code-bg);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1160px;margin:0 auto}

.top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px 24px;align-items:end;padding-block:24px 18px;border-bottom:2px solid var(--ink)}
.brand{display:flex;gap:14px;align-items:center;min-width:0}
.brand svg{flex:none;width:58px;height:34px;color:var(--ink)}
h1{font:700 clamp(1.45rem,3.4vw,2rem)/1.3 var(--display);margin:0;text-wrap:balance}
.top p{margin:2px 0 0;color:var(--muted);font-size:.92rem}
.meter{display:grid;gap:6px;min-width:230px}
.meter-row{display:grid;grid-template-columns:2.6em minmax(0,1fr) 3.4em;gap:8px;align-items:center;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.meter-row span:last-child{text-align:right}

.shell{display:grid;grid-template-columns:272px minmax(0,1fr);gap:32px;align-items:start;margin-top:24px}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);max-height:calc(100vh - 24px);overflow:auto;padding-right:4px}
.rail-toggle{display:none;width:100%;text-align:left;font:500 .98rem var(--body);padding:10px 12px;background:var(--surface);color:var(--ink);border:1px solid var(--line);cursor:pointer}
.rail-group{font-size:.76rem;font-weight:700;letter-spacing:.12em;color:var(--muted);margin:18px 0 6px}
.rail-group:first-child{margin-top:0}
.rail ol{list-style:none;margin:0;padding:0}
.rail button.st{display:grid;grid-template-columns:28px minmax(0,1fr);gap:9px;align-items:center;width:100%;padding:6px 8px;border:0;background:none;text-align:left;color:var(--ink);font:400 .93rem/1.4 var(--body);cursor:pointer}
.rail button.st:hover{background:var(--sunken)}
.rail button.st[aria-current="step"]{background:var(--surface);font-weight:700;box-shadow:inset 3px 0 0 var(--accent)}
.st b{display:grid;place-items:center;width:26px;height:26px;border:1.5px solid var(--line);border-radius:50%;font:500 .76rem var(--mono);color:var(--muted);background:var(--surface)}
.st.done b{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.st.part b{border-color:var(--accent);color:var(--accent)}
.rail-foot{margin-top:18px;padding-top:12px;border-top:1px solid var(--line);font-size:.82rem;color:var(--muted);display:grid;gap:8px}

main{min-width:0}
.sheet{background:var(--surface);border:1px solid var(--line);padding:clamp(18px,3vw,32px)}
.eyebrow{font-size:.8rem;font-weight:700;letter-spacing:.1em;color:var(--accent)}
h2{font:700 clamp(1.4rem,3vw,1.8rem)/1.35 var(--display);margin:2px 0 8px;text-wrap:balance}
h3{font:700 1.06rem/1.5 var(--body);margin:26px 0 8px}
.lead{margin:0 0 14px;max-width:62ch}
p{margin:0 0 10px;max-width:68ch}
ul,ol.plain{margin:0 0 12px;padding-left:1.3em}
li{margin-bottom:5px}
.muted{color:var(--muted)}.small{font-size:.88rem}

.checks{list-style:none;margin:0 0 12px;padding:0;counter-reset:n;border-top:1px solid var(--line)}
.checks>li{margin:0;border-bottom:1px solid var(--line)}
.chk{display:grid;grid-template-columns:22px minmax(0,1fr);gap:11px;padding:10px 4px;cursor:pointer;align-items:start}
.chk input{width:19px;height:19px;margin:4px 0 0;accent-color:var(--accent);cursor:pointer}
.chk input:checked+span{color:var(--muted)}
.seq>li{counter-increment:n}
.seq .chk>span::before{content:counter(n) "．";font:500 .9em var(--mono);color:var(--accent)}

.note{padding:11px 14px;margin:12px 0;background:var(--sunken);font-size:.94rem}
.note.warn{background:var(--warn-soft);color:var(--ink);box-shadow:inset 3px 0 0 var(--warn)}
.note.danger{background:var(--danger-soft);box-shadow:inset 3px 0 0 var(--danger)}
.note.good{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.note strong:first-child{display:block}
.note p:last-child{margin-bottom:0}

.tool{border:1.5px solid var(--ink);margin:20px 0;background:var(--surface)}
.tool-head{background:var(--ink);color:var(--surface);padding:7px 14px;font-weight:700;font-size:.92rem}
.tool-body{padding:14px;display:grid;gap:12px;min-width:0}
label.f{display:grid;gap:4px;font-weight:500;font-size:.93rem;min-width:0}
label.f small{font-weight:400;color:var(--muted)}
input[type=text],input[type=email],input[type=url],input[type=number],textarea,select{width:100%;padding:8px 10px;font:400 .96rem/1.5 var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:0}
textarea{resize:vertical;min-height:84px}
input.mono,textarea.mono{font-family:var(--mono);font-size:.88rem}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.btn{font:500 .93rem var(--body);padding:7px 14px;border:1.5px solid var(--ink);background:var(--surface);color:var(--ink);cursor:pointer}
.btn:hover{background:var(--sunken)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08);background:var(--accent)}
.btn.sm{padding:3px 9px;font-size:.82rem}
.btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:24px;padding-top:16px;border-top:2px solid var(--ink);align-items:center}
.nav .status{font-size:.88rem;color:var(--muted)}
.res{font-size:.92rem;padding:8px 12px;background:var(--sunken);min-width:0;overflow-wrap:anywhere}
.res.ok{background:var(--accent-soft)}.res.bad{background:var(--danger-soft)}.res.warn{background:var(--warn-soft)}
.res:empty{display:none}
.out{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);min-width:0}
.out code{display:block;background:none;padding:0;font-size:.84rem}
.out .lab{grid-column:1/-1;font-size:.84rem;color:var(--muted)}
.tbl{overflow-x:auto;margin:10px 0 14px}
table{border-collapse:collapse;width:100%;font-size:.91rem}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:.82rem;color:var(--muted);font-weight:700;border-bottom:1.5px solid var(--ink);white-space:nowrap}
.fig{background:#fff;border:1px solid var(--line);padding:8px;margin:12px 0}
.fig img{display:block;width:100%;height:auto}
details{margin:10px 0;border:1px solid var(--line)}
summary{cursor:pointer;padding:8px 12px;font-weight:500;font-size:.94rem}
details>div{padding:0 12px 10px}
pre{margin:8px 0;padding:10px 12px;background:var(--code-bg);overflow-x:auto;font:400 .84rem/1.6 var(--mono)}
.choices{display:grid;gap:8px}
.choice{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;padding:10px 12px;border:1.5px solid var(--line);cursor:pointer}
.choice:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.choice input{margin:5px 0 0;accent-color:var(--accent)}
.choice b{display:block}
.health{display:grid;gap:0;border-top:1px solid var(--line)}
.h-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:9px 0;border-bottom:1px solid var(--line);align-items:center}
.h-row p{margin:0;font-size:.88rem;color:var(--muted)}
.h-fix{grid-column:1/-1;font-size:.9rem;padding:7px 10px;background:var(--danger-soft)}
.seg{display:inline-flex}
.seg button{font:500 .8rem var(--mono);padding:3px 10px;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.seg button+button{border-left:0}
.seg button[aria-pressed="true"][data-v="ok"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg button[aria-pressed="true"][data-v="fail"]{background:var(--danger);border-color:var(--danger);color:var(--surface)}
.qr{background:#fff;padding:8px;width:176px;max-width:100%}
.qr svg{display:block;width:100%;height:auto}
.count{font:400 .78rem var(--mono);color:var(--muted);justify-self:end}
.count.over{color:var(--danger);font-weight:500}
.sc input{min-width:58px;padding:5px 6px}
.tag{display:inline-block;font-size:.78rem;font-weight:700;padding:1px 8px;white-space:nowrap}
.tag.ok{background:var(--accent-soft);color:var(--accent)}.tag.bad{background:var(--danger-soft);color:var(--danger)}.tag.none{background:var(--sunken);color:var(--muted)}
.tabs{display:flex;flex-wrap:wrap;gap:0;margin:8px 0 14px}
.tabs .btn+.btn{border-left:0}
mark{background:var(--warn-soft);color:inherit;padding:0 2px}

@media (max-width:860px){
  .top{grid-template-columns:minmax(0,1fr)}
  .meter{min-width:0}
  .shell{grid-template-columns:minmax(0,1fr);gap:14px;margin-top:14px}
  .rail{position:static;max-height:none;overflow:visible;padding:0}
  .rail-toggle{display:block}
  .rail-list{display:none;background:var(--surface);border:1px solid var(--line);border-top:0;padding:12px}
  .rail.open .rail-list{display:block}
}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="brand">
        <svg viewBox="0 0 58 34" fill="none" stroke="currentColor" stroke-width="1.8" role="img" aria-label="第三角投影法符號"><circle cx="14" cy="17" r="12"/><circle cx="14" cy="17" r="6"/><path d="M34 11 L55 3 V31 L34 23 Z"/><path d="M1 17H27M14 4V30M31 17H57" stroke-width=".8" stroke-dasharray="4 2 1 2"/></svg>
        <h1>生活科技萬用評分系統操作導引</h1>
      </div>
      <p>跟著工序一站一站做。勾選項目和你填的內容只存在這個瀏覽器，不會傳給任何人。</p>
    </div>
    <div class="meter" aria-label="完成進度">
      <div class="meter-row"><span>安裝</span><div class="bar"><i id="barInstall"></i></div><span id="numInstall">0/0</span></div>
      <div class="meter-row"><span>使用</span><div class="bar"><i id="barUse"></i></div><span id="numUse">0/0</span></div>
      <button class="btn sm" id="resume" type="button">前往下一個未完成的項目</button>
    </div>
  </header>

  <div class="shell">
    <aside class="rail" id="rail">
      <button class="rail-toggle" id="railToggle" type="button" aria-expanded="false"></button>
      <nav class="rail-list" id="railList" aria-label="工序"></nav>
    </aside>
    <main><article class="sheet" id="sheet"></article></main>
  </div>
</div>

<script>
"use strict";
const KEY='tech-grading-guide-v1';
const blank=()=>({checks:{},step:'check',mode:'',pick:'',sheet:'',folder:'',email:'',exec:'',health:{},tpl:{},rows:[],crit:{score:100,text:''},models:''});
function load(){try{return Object.assign(blank(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){return blank()}}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

// ── 純邏輯：與系統程式的規則一致 ──
function parseId(raw,kind){
  const t=String(raw||'').trim();
  if(!t) return {status:'',msg:''};
  const other=kind==='sheet'?'資料夾':'試算表';
  if(/drive\/my-drive/.test(t)) return {status:'bad',msg:'這是「我的雲端硬碟」最上層的網址，沒有 ID。請先建立資料夾並進入它，再複製網址。'};
  if(kind==='sheet'&&/\/folders\//.test(t)) return {status:'bad',msg:'這是資料夾的網址，請貼試算表的網址。'};
  if(kind==='folder'&&/\/spreadsheets\//.test(t)) return {status:'bad',msg:'這是試算表的網址，請貼資料夾的網址。'};
  let id=t, fromUrl=false;
  if(/https?:|\.google\.com|\//.test(t)){
    const m=kind==='sheet'?t.match(/\/spreadsheets\/(?:u\/\d+\/)?d\/([^/?#\s]+)/):t.match(/\/folders\/([^/?#\s]+)/);
    if(!m) return {status:'bad',msg:`找不到${kind==='sheet'?'試算表':'資料夾'} ID。請確認貼的是${kind==='sheet'?'試算表本身畫面':'進入資料夾後'}的網址，不是${other}或其他頁面。`};
    id=m[1]; fromUrl=true;
  }
  if(!/^[A-Za-z0-9_-]+$/.test(id)) return {status:'bad',msg:'ID 只能有英文字母、數字、- 與 _。請檢查有沒有多複製到空白或其他符號。'};
  if(kind==='sheet'&&/rtpof=true/.test(t)) return {status:'warn',id,msg:'這個網址看起來是上傳的 Excel 檔，系統無法使用。請點「檔案」→「儲存為 Google 試算表」，再複製新試算表的網址。'};
  if(id.length<25||id.length>45) return {status:'warn',id,msg:`長度是 ${id.length} 個字元，一般 ID 大約 25～45 個字元。請確認有複製完整。`};
  return {status:'ok',id,msg:fromUrl?'已從網址取出 ID。':'格式正確。'};
}
function parseExec(raw){
  const t=String(raw||'').trim();
  if(!t) return {status:''};
  const m=t.match(/^(https:\/\/script\.google\.com\/(?:a\/(?:macros\/)?[^/]+\/)?(?:macros\/)?s\/[\w-]+\/(exec|dev))(?:\?.*)?$/);
  if(!m) return {status:'bad',msg:'這不是網頁應用程式的網址。正確的網址開頭是 https://script.google.com/，結尾是 /exec。'};
  if(m[2]==='dev') return {status:'bad',msg:'這是結尾為 /dev 的測試網址，學生打不開。請到「部署」→「管理部署作業」複製結尾為 /exec 的網址。'};
  return {status:'ok',student:m[1],teacher:m[1]+'?page=teacher'};
}
function parseCriteria(text,max){
  const lines=String(text||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  if(!lines.length) return {status:'',items:[]};
  const items=[];
  for(const l of lines){
    const m=l.match(/^(.*?)\s*[|｜:：,，\t ]\s*([\d.]+)\s*分?$/);
    if(!m||!m[1].trim()||!(Number(m[2])>0)) return {status:'bad',msg:`「${l}」格式不正確，請寫成「名稱｜配分」，配分要大於 0。`};
    items.push({name:m[1].trim(),max:Number(m[2])});
  }
  if(new Set(items.map(c=>c.name)).size!==items.length) return {status:'bad',msg:'有重複的細項名稱，系統不會接受。'};
  const sum=Math.round(items.reduce((a,c)=>a+c.max,0)*10)/10;
  if(Math.abs(sum-max)>0.01) return {status:'bad',msg:`細項加總是 ${sum}，本題配分是 ${max}，相差 ${Math.round((max-sum)*10)/10} 分。兩邊要相等才能建立評量。`,sum};
  return {status:'ok',msg:`加總 ${sum} 分，等於本題配分，可以直接貼到「固定評分細項」。`,sum,items};
}
function splitCriteria(names,score){
  const n=names.map(x=>x.trim()).filter(Boolean); score=Number(score)||0;
  if(!n.length||score<=0) return '';
  if(score<n.length||!Number.isInteger(score)) return `整體表現｜${score}`;
  const base=Math.floor(score/n.length),rem=score-base*n.length;
  return n.map((x,i)=>`${x}｜${base+(i<rem?1:0)}`).join('\n');
}
function parseModels(raw){
  const list=[...new Set(String(raw||'').split(/[,，\s]+/).map(x=>x.trim().replace(/^models\//,'')).filter(Boolean))];
  if(!list.length) return {status:''};
  const bad=list.find(m=>!/^[a-z0-9][a-z0-9.\-]*$/.test(m));
  if(bad) return {status:'bad',msg:`「${bad}」格式不正確。請填模型代碼：全小寫英文、數字、連字號，例如 gemini-x.x-flash。`};
  if(list.length>5) return {status:'bad',msg:'最多設定 5 個模型。'};
  const risky=list[0].match(/preview|exp/);
  const notes=[];
  if(risky) notes.push('第一個模型是測試版，Google 可能隨時停用，不建議放第一個。');
  if(/lite/.test(list[0])) notes.push('Lite 的圖片判讀準確度可能不足，不建議用來評分。');
  if(list.length===1) notes.push('建議再加一個穩定的舊版當備援。');
  return {status:notes.length?'warn':'ok',list,msg:notes.length?notes.join(''):`格式正確：主要模型 ${list[0]}，備援 ${list.slice(1).join('、')}。`};
}
function coach(text){
  const rules=[
    [/用心|認真|努力|有創意|有巧思/g,'這是評價，照片看不出來。改寫成看得到的現象，例如「表面沒有明顯刮痕，邊角已磨圓」。'],
    [/良好|不錯|漂亮|美觀|優秀|大致/g,'沒有判斷標準。寫清楚怎樣才算達到，例如「接合處沒有肉眼可見的縫隙，四角呈直角」。'],
    [/承重|通電|能亮|會亮|會動|能動|耐用|防水|載重/g,'照片測不出功能。改評看得到的結構，功能請課堂實測，例如「支撐結構有三角形補強」。'],
    [/都要好|和外觀|與外觀|和結構/g,'一個細項只評一件事，請拆成兩個細項。']
  ];
  const found=[];
  rules.forEach(([re,tip])=>{const hits=[...new Set(String(text||'').match(re)||[])];if(hits.length)found.push({hits,tip})});
  return found;
}
function drift(max,mine,ai){
  const d=Math.round((ai-mine)*10)/10;
  return {diff:d,drift:Math.abs(d)>Math.max(1,max*0.2)};
}

function copyText(text){
  const legacy=()=>{
    const ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}ta.remove();
    return ok?Promise.resolve():Promise.reject(new Error('copy failed'));
  };
  try{if(navigator.clipboard&&navigator.clipboard.writeText)return navigator.clipboard.writeText(text).catch(legacy)}catch(e){}
  return legacy();
}

{id:'key',group:'安裝',title:'申請 Gemini API 金鑰',goal:'API 金鑰是系統呼叫 Gemini 的通行碼，要像密碼一樣保管。',html:()=>`
${seq('key',[
'開啟 <a href="https://aistudio.google.com" target="_blank" rel="noopener">Google AI Studio</a>，用 Google 帳號登入。第一次進入時需要同意服務條款。',
'點「Get API key」（取得 API 金鑰）→「Create API key」（建立 API 金鑰）。',
'複製產生的金鑰（通常以 <code>AIza</code> 開頭），暫存到記事本。'])}
<div class="note warn"><strong>金鑰不要貼進這個頁面</strong>這個導引不需要你的金鑰或密碼。它們只該貼到第四站的 Apps Script「指令碼屬性」。</div>
${fold('遇到狀況',`<ul>
<li><b>學校帳號進不了 AI Studio：</b>可能是管理員關閉了服務。請洽資訊組，或改用個人帳號申請。金鑰可以和部署系統的帳號不同。</li>
<li><b>金鑰不小心外流：</b>到 AI Studio 的金鑰清單刪除它，建立新的，再到指令碼屬性更新。</li>
<li><b>費用與個資：</b>免費和付費方案的條款不同。<button class="btn sm" type="button" data-go="privacy">看比較</button></li></ul>`)}`},

{id:'paste',group:'安裝',title:'建立專案並貼上程式',goal:'把三個程式檔貼進 Google 內建的程式編輯器。完成後，左側「檔案」區剛好有三個檔案。',html:()=>`
${seq('paste',[
'打開第一站的試算表，點上方選單「擴充功能」→「Apps Script」。',
'點左上角「未命名的專案」，改名例如 <code>生活科技評分系統</code>。',
'點左側 <code>程式碼.gs</code>（英文介面是 <code>Code.gs</code>），按 Ctrl+A 全選後刪除，貼上 <code>code.gs</code> 的全部內容。',
'點「檔案」右邊的「＋」→「HTML」，名稱輸入 <code>student</code>。編輯器會自動加上 .html。',
'把新檔案的預設內容全選刪除，貼上 <code>student.html</code> 的全部內容。',
'用同樣方式新增 <code>teacher</code>，貼上 <code>teacher.html</code> 的全部內容。',
'按上方的磁碟片圖示（或 Ctrl+S）存檔。'])}
<div class="note warn"><strong>三件最常出錯的事</strong><ul style="margin:4px 0 0">
<li><b>檔名要一字不差：</b>student 與 teacher 全部小寫，否則網頁打不開。</li>
<li><b>只能有一個 .gs 檔：</b>多建了請刪掉，兩個 .gs 檔會互相衝突。</li>
<li><b>要複製完整：</b><code>teacher.html</code> 很長，請用 Ctrl+A 全選再複製，不要用滑鼠拖曳。</li></ul></div>
<p class="small muted">Mac 請把 Ctrl 換成 ⌘。</p>`},

{id:'config',group:'安裝',title:'填入你自己的設定',goal:'改兩個地方：程式開頭的三個設定值，以及專案設定裡的指令碼屬性。',html:()=>`
<h3>A. 修改程式開頭的 CONFIG</h3>
${tool('設定值產生器',`
<div class="two">
<label class="f">試算表 ID <input class="mono" type="text" id="cfgSheet" autocomplete="off" spellcheck="false"></label>
<label class="f">資料夾 ID <input class="mono" type="text" id="cfgFolder" autocomplete="off" spellcheck="false"></label>
</div>
<label class="f">部署系統所用的 Google 帳號信箱 <input type="email" id="cfgEmail" autocomplete="off" spellcheck="false" placeholder="name@school.edu.tw"></label>
<div id="cfgOut"></div>`)}
<p>打開 <code>程式碼.gs</code>，依上面的對照，把單引號裡的文字換掉。前後的單引號 <code>'</code> 與行尾的逗號都要保留，單引號和 ID 之間不要有空白。<code>MODELS</code> 先不用改。</p>
${flat('config.a',['三個設定值都換好，按 Ctrl+S 存檔。'])}
<h3>B. 新增指令碼屬性</h3>
<p>金鑰與密碼屬於機密，放在這裡才不會寫進程式。點編輯器左側齒輪「專案設定」，捲到最下方「指令碼屬性」，點「新增指令碼屬性」。</p>
${table(['屬性名稱（大寫、一字不差）','值','必填',''],[
['<code>GEMINI_API_KEY</code>','第二站的 API 金鑰','是',copyBtn('GEMINI_API_KEY')],
['<code>TEACHER_PASSWORD</code>','自訂的教師後台密碼，建議 10 碼以上，不要和其他帳號共用','強烈建議',copyBtn('TEACHER_PASSWORD')],
['<code>GEMINI_API_KEYS</code>','多把金鑰，用半形逗號分隔；一把額度用完自動換下一把。設定後會取代 <code>GEMINI_API_KEY</code>','選用',copyBtn('GEMINI_API_KEYS')]])}
${flat('config.b',['已新增 <code>GEMINI_API_KEY</code>。','已新增 <code>TEACHER_PASSWORD</code>。系統部署後，Google 多半不會告訴系統是誰在看，沒有密碼你可能進不了教師後台。','已按「儲存指令碼屬性」。'])}`},

{id:'deploy',group:'安裝',title:'授權並部署成網頁',goal:'部署後會得到一個網址：學生直接開，老師在後面加上 ?page=teacher。',html:()=>`
<h3>A. 授權（只需做一次）</h3>
${seq('deploy.a',[
'編輯器上方「執行」旁的函式選單，選 <code>getServerVersion</code>，按「執行」。',
'跳出「需要授權」→ 按「審查權限」→ 選擇你的 Google 帳號。',
'出現「Google 尚未驗證這個應用程式」時，點左下角「進階」→「前往『生活科技評分系統』（不安全）」→ 按「允許」。',
'下方「執行記錄」出現「執行完畢」。'])}
<p class="small muted">看到「不安全」是因為這支程式由你自己建立、沒有送 Google 審查。系統只會存取你在第四站指定的試算表與資料夾。</p>
<h3>B. 部署</h3>
${seq('deploy.b',[
'點右上角「部署」→「新增部署作業」。',
'點左側「選取類型」旁的齒輪 →「網頁應用程式」。',
'依下表填寫，再按「部署」。',
'複製畫面上的網頁應用程式網址（結尾是 <code>/exec</code>），貼到下方工具。'])}
${table(['欄位','選擇','原因'],[

function stepChecks(id){

  return [...sec.querySelectorAll('input[data-chk]')].filter(c=>!c.closest('[hidden]:not([data-step])'));
}
function stepStat(id){const cs=stepChecks(id);return {total:cs.length,done:cs.filter(c=>c.checked).length}}

function renderRail(){
  const groups=['安裝','使用','查閱'];

  $('railList').innerHTML=groups.map(g=>{
    const items=STEPS.filter(s=>s.group===g);
    n=g==='安裝'?-1:0;
    return `<div class="rail-group">${g}</div><ol>${items.map(s=>{
      const st=stepStat(s.id),cls=st.total&&st.done===st.total?'done':st.done?'part':'';
      n++;

function renderProgress(){

}

function tplVal(){const o={};['tName','tMode','tRole','tRules','tErrors','tRubric','tHint','tCrit'].forEach(k=>o[k]=$(k).value);return o}
function updateTpl(){
  const v=tplVal();S.tpl=v;save();
  const problems=[];
  Object.keys(TPL_LIMITS).forEach(k=>{
    const n=v[k].trim().length,c=sheet.querySelector(`[data-count="${k}"]`);
    c.textContent=`${n} / ${TPL_LIMITS[k]}`;c.classList.toggle('over',n>TPL_LIMITS[k]);
    if(n>TPL_LIMITS[k]) problems.push(`${TPL_LABELS[k]}超過 ${TPL_LIMITS[k]} 字。`);
  });
  const errs=v.tErrors.split(/\r?\n/).map(x=>x.trim()).filter(Boolean),crit=v.tCrit.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);

  ce.textContent=`${errs.length} / 20 個`;ce.classList.toggle('over',errs.length>20);
  cc.textContent=`${crit.length} / 10 個`;cc.classList.toggle('over',crit.length>10);
  if(errs.length>20||errs.some(x=>x.length>30)) problems.push('錯誤類型最多 20 個，每個最多 30 字。');
  if(crit.length>10||crit.some(x=>x.length>30)) problems.push('預設評分細項最多 10 個，每個最多 30 字。');
  const missing=[];
  if(!v.tName.trim())missing.push('範本名稱');if(!v.tRole.trim())missing.push('評分角色');if(!v.tRules.trim())missing.push('評分原則');if(!errs.length)missing.push('錯誤類型');
  if(problems.length) setRes($('tplRes'),{status:'bad',msg:problems.join('')});
  else if(missing.length) setRes($('tplRes'),{status:'warn',msg:`後台必填，還沒寫：${missing.join('、')}。`});
  else setRes($('tplRes'),{status:'ok',msg:'必填欄位都有了，長度也在上限內。可以逐欄複製到後台。'});

function updateScore(){
  let filled=0,bad=0,sum=0;
  [...$('scBody').children].forEach((tr,i)=>{
    const r=S.rows[i],has=[r.m,r.t,r.a].every(x=>x!==''&&Number.isFinite(Number(x)));
    const dEl=tr.querySelector('[data-out=d]'),vEl=tr.querySelector('[data-out=v]');
    if(!has){dEl.textContent='—';vEl.innerHTML='<span class="tag none">待填</span>';return}
    const x=drift(Number(r.m),Number(r.t),Number(r.a));
    filled++;sum+=Math.abs(x.diff);if(x.drift)bad++;
    dEl.textContent=(x.diff>0?'+':'')+x.diff;
    vEl.innerHTML=x.drift?'<span class="tag bad">走樣</span>':'<span class="tag ok">正常</span>';
  });
  const el=$('scRes');
  if(!filled){setRes(el,{status:'',msg:''});return}
  const avg=Math.round(sum/filled*10)/10;
  if(filled<3) setRes(el,{status:'warn',msg:`已比對 ${filled} 份，平均差距 ${avg} 分。建議至少比對 3 份再下判斷。`});
  else if(bad) setRes(el,{status:'bad',msg:`${filled} 份中有 ${bad} 份走樣，平均差距 ${avg} 分。先改規準或把看不出來的細項改成課堂實測，再比對一次。`});
  else setRes(el,{status:'ok',msg:`${filled} 份都在容許範圍內，平均差距 ${avg} 分。可以正式使用，AI 分數仍請老師覆核。`});
}

// ── 事件 ──
document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-go]');if(!t)return;
  if(t.dataset.go!==undefined&&t.dataset.go){go(t.dataset.go,true);return}
  if(t.dataset.copy!==undefined){
    const done=()=>{const o=t.textContent;t.textContent='已複製';setTimeout(()=>t.textContent=o,1200)};
    const fail=()=>{const o=t.textContent;t.textContent='請手動選取';setTimeout(()=>t.textContent=o,1600)};
    copyText(t.dataset.copy).then(done,fail);
    return;
  }
  if(t.dataset.path){S.pick=t.dataset.path;save();updatePick();renderProgress();return}
  if(t.parentElement&&t.parentElement.classList.contains('seg')){
    const k=t.closest('.h-row').dataset.h;S.health[k]=S.health[k]===t.dataset.v?'':t.dataset.v;save();updateHealth();return;
  }
  if(t.dataset.del!==undefined){S.rows.splice(Number(t.dataset.del),1);save();renderScore();return}
  switch(t.id){
    case 'resume':{const n=nextUnfinished();if(n)go(n,true);else t.textContent='全部完成了';break}
    case 'railToggle':{const o=$('rail').classList.toggle('open');t.setAttribute('aria-expanded',String(o));break}
    case 'resetBtn':$('resetConfirm').hidden=false;t.hidden=true;break;
    case 'resetNo':renderRail();break;
    case 'resetYes':{const step=S.step;S=blank();S.step=step;save();refreshAll();go(step);break}
    case 'critSplit':{const v=splitCriteria($('critNames').value.split(/[、,，\n]/),$('critScore').value);if(v){$('critText').value=v;updateCrit()}break}
    case 'critCopy':{const v=$('critText').value.trim();if(!v)break;copyText(v).then(()=>{t.textContent='已複製';setTimeout(()=>t.textContent='複製細項',1200)},()=>{$('critText').select()});break}
    case 'tplExample':Object.keys(TPL_EXAMPLE).forEach(k=>$(k).value=TPL_EXAMPLE[k]);updateTpl();break;
    case 'tplClear':['tName','tRole','tRules','tErrors','tRubric','tHint','tCrit'].forEach(k=>$(k).value='');updateTpl();break;
    case 'scAdd':if(S.rows.length<8){S.rows.push({n:`樣本 ${S.rows.length+1}`,m:'',t:'',a:''});save();renderScore()}break;
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.chk){S.checks[t.dataset.chk]=t.checked;save();renderProgress();return}
  if(t.name==='mode'){S.mode=t.value;save();updateMode();renderProgress();return}
  if(t.name==='pick'){S.pick=t.value;save();updatePick();renderProgress();return}
  if(t.id==='tMode')updateTpl();
});
document.addEventListener('input',e=>{
  const t=e.target,id=t.id;
  if(id==='inSheet'){S.sheet=t.value;save();updateIds()}
  else if(id==='inFolder'){S.folder=t.value;save();updateIds()}
  else if(id==='cfgSheet'){S.sheet=t.value;save();setRes($('resSheet'),parseId(S.sheet,'sheet'));$('inSheet').value=S.sheet;updateCfg()}
  else if(id==='cfgFolder'){S.folder=t.value;save();setRes($('resFolder'),parseId(S.folder,'folder'));$('inFolder').value=S.folder;updateCfg()}
  else if(id==='cfgEmail'){S.email=t.value;save();updateCfg()}
  else if(id==='inExec'){S.exec=t.value;save();updateExec()}
  else if(id==='critScore'||id==='critText')updateCrit();
  else if(/^t(Name|Role|Rules|Errors|Rubric|Hint|Crit)$/.test(id))updateTpl();
  else if(id==='modelIn'){S.models=t.value;save();setRes($('modelRes'),parseModels(t.value))}
  else if(id==='featQ')renderFeatures();
  else if(id==='faqQ')renderFaq();
  else if(t.dataset&&t.dataset.f){const i=Number(t.closest('tr').dataset.i);S.rows[i][t.dataset.f]=t.value;save();updateScore()}
});

// ── 啟動 ──
refreshAll();
const hash=location.hash.replace('#','');
go(STEPS.some(s=>s.id===hash)?hash:S.step);
</script>
</body>
</html>
